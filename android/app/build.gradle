plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.syncwatch.app'
    compileSdk 33

    defaultConfig {
        applicationId "app.noxreel.android"
        minSdk 26          // Android 8+；用户目标机是 12，向下多兼容几档
        targetSdk 31       // 适配安卓 12
        versionCode 8
        versionName "0.6.1"
    }

    buildTypes {
        debug {
            // 调试包，直接 adb install 即可，不签名商店
            applicationIdSuffix ""
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // ExoPlayer 2.19：用原生 MediaCodec 解 HEVC，WebView 的 <video>/MSE 靠不住。
    // 边下边播靠自定义 DataSource，只读到连续水位线为止。
    implementation 'com.google.android.exoplayer:exoplayer-core:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-ui:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-hls:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-dash:2.19.1'
}
